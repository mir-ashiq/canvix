
name: Canvix Database Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database setup
        run: npm run db:setup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # v0.9: verify accounts + per-design ownership against the live DB
      # (boots the built server, exercises register/login/me/adopt/403,
      # removes its own probe rows afterwards).
      - name: Smoke-test accounts & ownership
        run: bash scripts/auth-e2e.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
