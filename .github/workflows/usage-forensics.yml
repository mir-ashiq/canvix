name: usage-forensics

# One-shot DB forensics for the Vercel usage investigation.
# Prints aggregates only — counts, sizes, dates. No row content, no secrets.
on:
  workflow_dispatch:

jobs:
  forensics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Run DB forensics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/usage-forensics.ts
