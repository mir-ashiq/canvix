name: Docker images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 0.23.1
        type: string
        required: false
        default: ""
      latest:
        description: Also tag the image as latest
        type: boolean
        default: false
      platforms:
        description: Docker platforms to build
        type: choice
        default: linux/amd64,linux/arm64
        options:
          - linux/amd64,linux/arm64
          - linux/amd64

concurrency:
  group: canvix-docker-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    if: github.repository == 'mir-ashiq/canvix'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ] && ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The version must look like 0.23.1." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mir-ashiq/canvix-web
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.latest }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Canvix
            org.opencontainers.image.description=Self-hosted Canvix web application
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows-installer:
    if: github.repository == 'mir-ashiq/canvix' && inputs.version != ''
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish launcher
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          dotnet publish packaging/windows/CanvixLauncher/CanvixLauncher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=$env:VERSION

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          wix build packaging/windows/Canvix.wxs
          -arch x64
          -d ProductVersion=$env:VERSION
          -d PublishDir=packaging/windows/CanvixLauncher/bin/Release/net8.0-windows/win-x64/publish
          -d SourceDir=packaging/windows
          -o CanvixSetup.msi

      - name: Publish setup EXE
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          MSI_PATH: ${{ github.workspace }}\CanvixSetup.msi
        run: >-
          dotnet publish packaging/windows/CanvixSetupBootstrapper/CanvixSetupBootstrapper.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=$env:VERSION
          -p:MsiPath=$env:MSI_PATH

      - name: Copy setup EXE
        shell: pwsh
        run: Copy-Item packaging/windows/CanvixSetupBootstrapper/bin/Release/net8.0-windows/win-x64/publish/CanvixSetup.exe .\CanvixSetup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: canvix-windows-installer
          path: |
            CanvixSetup.msi
            CanvixSetup.exe
          if-no-files-found: error

  release:
    needs: [image, windows-installer]
    if: inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: canvix-windows-installer

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          printf '%s\n' \
            "Docker image: ghcr.io/mir-ashiq/canvix-web:$VERSION" \
            "" \
            "Windows users can install Canvix with CanvixSetup.exe or CanvixSetup.msi." \
            > notes.md
          if gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "v$VERSION" --repo "$REPO" --clobber CanvixSetup.msi CanvixSetup.exe
          else
            gh release create "v$VERSION" --repo "$REPO" --target "$SHA" --title "v$VERSION" --notes-file notes.md --generate-notes CanvixSetup.msi CanvixSetup.exe
          fi
